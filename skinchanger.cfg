// Настройки сервера
sv_cheats 1
mp_drop_knife_enable 1
sv_gameinstructor_disable 0
mp_display_killing_player_delay 0

// МЕНЯЕМ МАГИЮ ДЕПОЗИТА ПОД НАШЕ МЕНЮ
// Создаем скрипт-контроллер, который сожрет наш новый JS-файл
ent_create point_script {"cs_script" "cfg/skinchanger.vjs"}

// Создаем алиасы (команды), чтобы пинать функции внутри JS
alias "menu_press_1" "ent_fire point_script RunScriptInput MenuInput 1"
alias "menu_press_2" "ent_fire point_script RunScriptInput MenuInput 2"
alias "menu_press_3" "ent_fire point_script RunScriptInput MenuInput 3"
alias "menu_press_back" "ent_fire point_script RunScriptInput MenuBack"

// Биндим кнопки на управление (слоты оружия 1, 2, 3 и кнопка выкинуть нож G)
bind "1" "slot1; menu_press_1"
bind "2" "slot2; menu_press_2"
bind "3" "slot3; menu_press_3"
bind "g" "drop; menu_press_back"

// Кнопка, чтобы принудительно обновить/вызвать плашку на экран, если она пропала
bind "M" "ent_fire point_script RunScriptInput DrawMenu"

// Спец-эффекты для пранка
sv_infinite_ammo 1
god

echo "======================================================="
echo "=== СУПЕР-ПЛAШКА МЕНЮ ОТ ДЕПОЗИТА УСПЕШНО ЗАРЯЖЕНА ==="
echo "=== Для запуска пиши: exec skinchanger               ==="
echo "=== Если меню пропало, нажми клавишу M              ==="
echo "======================================================="
