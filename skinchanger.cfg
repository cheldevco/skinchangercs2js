sv_cheats 1
mp_drop_knife_enable 1
sv_gameinstructor_disable 0

// Очищаем старые бинды кнопок, чтобы ничего не ломалось
bind "1" "slot1"
bind "2" "slot2"
bind "3" "slot3"
bind "g" "drop"

// НАСТРАИВАЕМ ТЕКСТОВЫЕ КОМАНДЫ ДЛЯ КОНСОЛИ
// Игра сама выдаст нож и БЕЗ ВСЯКОГО JS бахнет сочную плашку по центру экрана!

alias "k" "slot3; drop; ent_create weapon_knife_karambit; ui_event 'show_survival_notice' '=== СКИНЧЕНДЖЕР ===' 'Выдан нож: КЕРАМБИТ'"

alias "b" "slot3; drop; ent_create weapon_knife_butterfly; ui_event 'show_survival_notice' '=== СКИНЧЕНДЖЕР ===' 'Выдан нож: БАБОЧКА'"

alias "m9" "slot3; drop; ent_create weapon_knife_m9_bayonet; ui_event 'show_survival_notice' '=== СКИНЧЕНДЖЕР ===' 'Выдан нож: ШТЫК-НОЖ M9'"

alias "fbi" "sub_model models/player/custom_player/legacy/ctm_fbi_variantf.vmdl; ui_event 'show_survival_notice' '=== СМЕНА АГЕНТА ===' 'Выдан агент: FBI'"

alias "sas" "sub_model models/player/custom_player/legacy/ctm_sas_variantf.vmdl; ui_event 'show_survival_notice' '=== СМЕНА АГЕНТА ===' 'Выдан агент: SAS'"

// Пранк-ВХ (Включается на команду wh, выключается на wh_off)
alias "wh" "r_drawothermodels 2; ui_event 'show_survival_notice' '=== ПРАНК ВХ ===' 'Подсветка стен: ВКЛЮЧЕНА'"
alias "wh_off" "r_drawothermodels 1; ui_event 'show_survival_notice' '=== ПРАНК ВХ ===' 'Подсветка стен: ВЫКЛЮЧЕНА'"

// Пранк-Аим (Каждый раз при вводе команды aim притягивает всех ботов к твоему прицелу)
alias "aim" "ent_teleport cs_bot; ui_event 'show_survival_notice' '=== ПРАНК АИМ ===' 'БОТЫ ПРИТЯНУТЫ К ПРИЦЕЛУ!'"

// Автоматически спавним бота для пранков
bot_add_ct

// Дополнительные настройки для угара
sv_infinite_ammo 1
god

// Бахаем стартовую плашку при загрузке конфига
ui_event "show_survival_notice" "=== КОМАНДЫ НАСТРОЕНЫ ===" "В консоли пиши: k, b, m9, fbi, sas, aim, wh"

echo "======================================================="
echo "=== ВСЁ ЧИСТОЕ И РАБОТАЕТ БЕЗ JS ОШИБОК             ==="
echo "=== Пиши в консоли буквы: k, b, m9, fbi, sas, aim, wh ==="
echo "======================================================="
