sv_cheats 1
mp_drop_knife_enable 1
sv_gameinstructor_disable 0
mp_display_killing_player_delay 0

// Перезапускаем скрипт, чтобы обновить код
script_reload_code "skinchanger.js"

// СОЗДАЕМ ТЕKСТОВЫЕ КОМАНДЫ ДЛЯ КОНСОЛИ
// Теперь слова k, b, m9, aim, wh станут полноценными командами игры!
alias "k" "script_reload_code skinchanger.js; ent_fire point_script RunScriptInput SetKarambit"
alias "b" "script_reload_code skinchanger.js; ent_fire point_script RunScriptInput SetButterfly"
alias "m9" "script_reload_code skinchanger.js; ent_fire point_script RunScriptInput SetM9"
alias "fbi" "script_reload_code skinchanger.js; ent_fire point_script RunScriptInput SetAgentFBI"
alias "sas" "script_reload_code skinchanger.js; ent_fire point_script RunScriptInput SetAgentSAS"
alias "aim" "script_reload_code skinchanger.js; ent_fire point_script RunScriptInput ToggleAim"
alias "wh" "script_reload_code skinchanger.js; ent_fire point_script RunScriptInput ToggleWH"

// Спавним бота для тестов
bot_add_ct

// Дополнительные настройки для пранка
sv_infinite_ammo 1
god

echo "======================================================="
echo "=== ТЕКСТОВЫЕ КОМАНДЫ НАСТРОЕНЫ                     ==="
echo "=== Открой консоль и пиши буквы: k, b, m9, aim, wh ==="
echo "======================================================="
