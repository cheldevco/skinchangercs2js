sv_cheats 1
mp_drop_knife_enable 1
sv_gameinstructor_disable 0

// УДАЛЯЕМ СТАРЫЙ ОБЪЕКТ ЕСЛИ ОН БЫЛ, ЧТОБЫ ИГРА НЕ ГЛЮЧИЛА
ent_fire point_script kill

// МАГИЯ: СОЗДАЕМ НЕВИДИМЫЙ ОБЪЕКТ И СРАЗУ ЗАПИХИВАЕМ В НЕГО НАШ JS
ent_create point_script {"targetname" "point_script" "cs_script" "cfg/skinchanger.js"}

// ТЕКСТОВЫЕ КОМАНДЫ-АЛИАСЫ ДЛЯ КОНСОЛИ
alias "k" "ent_fire point_script RunScriptInput SetKarambit"
alias "b" "ent_fire point_script RunScriptInput SetButterfly"
alias "m9" "ent_fire point_script RunScriptInput SetM9"
alias "fbi" "ent_fire point_script RunScriptInput SetAgentFBI"
alias "sas" "ent_fire point_script RunScriptInput SetAgentSAS"
alias "aim" "ent_fire point_script RunScriptInput ToggleAim"
alias "wh" "ent_fire point_script RunScriptInput ToggleWH"

// Спавним бота для тестов
bot_add_ct

// Дополнительные настройки для пранка
sv_infinite_ammo 1
god

echo "======================================================="
echo "=== ТЕКСТОВЫЕ КОМАНДЫ НАСТРОЕНЫ                     ==="
echo "=== Открой консоль и пиши буквы: k, b, m9, aim, wh ==="
echo "======================================================="
